name = "inkognito-push"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Sends queued web push notifications every minute. Setup:
#   1. node generate-vapid.mjs   (prints a key pair; put the PUBLIC key below and in the web app as NEXT_PUBLIC_VAPID_PUBLIC_KEY)
#   2. wrangler secret put SUPABASE_SERVICE_KEY   and   wrangler secret put VAPID_PRIVATE_KEY
[triggers]
crons = ["* * * * *"]

[vars]
SUPABASE_URL = ""
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:you@example.com"
