name = "inkognito-random"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Per environment. Secrets are set with `wrangler secret put`, never committed:
#   SUPABASE_SERVICE_KEY  (service_role key)   ROOM_SECRET  (32+ random bytes, base64)
[vars]
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""
ALLOWED_ORIGINS = "http://localhost:3000"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker", "Room"]

# Audio/video only: Cloudflare Realtime TURN (dashboard > Realtime > TURN). Without these, calls use STUN only and fail behind strict NATs.
#   wrangler secret put CF_TURN_KEY_ID      wrangler secret put CF_TURN_API_TOKEN
